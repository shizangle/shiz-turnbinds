name: Build and release

on:
  push:
    tags: ['v*']        # e.g. git tag v1.0.0 && git push origin v1.0.0
  workflow_dispatch:     # manual run from the Actions tab (uploads a build artifact only)

permissions:
  contents: write        # needed to create the release

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Configure
        run: cmake -S . -B build -A x64

      - name: Build
        run: cmake --build build --config Release

      - name: Package
        shell: pwsh
        run: |
          Compress-Archive -Path build/Release/Shiz-Turnbinds.exe -DestinationPath Shiz-Turnbinds-windows-x64.zip

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: Shiz-Turnbinds-windows-x64
          path: |
            build/Release/Shiz-Turnbinds.exe

      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            Shiz-Turnbinds-windows-x64.zip
            build/Release/Shiz-Turnbinds.exe
          generate_release_notes: true
